<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Momentum — Brain Dump</title><link rel="stylesheet" href="../assets/design.css"></head><body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="sb-right">5G ▮▮▮ 87%</span></div>
  <div class="screen" style="opacity:.22;padding-top:20px"><h1>Focus</h1><div class="card lg center mt5" style="height:280px"></div></div>

  <div class="sheet-wrap"><div class="sheet">
    <div class="grabber"></div>
    <h2>Quick Brain Dump</h2>
    <p class="tiny mt2">Park distracting thoughts instantly during your focus sprint.</p>

    <div class="row gap2 mt5">
      <div class="field grow">Park a thought...</div>
      <button class="btn" style="width:76px;min-height:46px;flex:0 0 auto;font-size:13px">Add</button>
    </div>

    <div class="col gap2 mt5">
      <div class="card" style="padding:12px"><div class="row gap3"><span class="check done">✓</span><span class="small grow" style="color:var(--text-3);text-decoration:line-through">Reply to Sam about the deck</span><span class="txt3">✕</span></div></div>
      <div class="card" style="padding:12px"><div class="row gap3"><span class="check">✓</span><span class="small grow">Check train times for Friday</span><span class="txt3">✕</span></div></div>
      <div class="card" style="padding:12px"><div class="row gap3"><span class="check">✓</span><span class="small grow">Idea: move stand-up to 10:30</span><span class="txt3">✕</span></div></div>
    </div>

    <div class="row gap2 mt5 tiny txt3"><span class="dot"></span><span>Notes stay on this device until you remove them.</span></div>
  </div></div>

  <nav class="bottom-nav">
    <div class="nav-item"><span class="nav-pill"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>Today</div>
    <div class="nav-item"><span class="nav-pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg></span>Habits</div>
    <div class="nav-item"><span class="nav-pill"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M2 20h20"/></svg></span>Insights</div>
    <div class="nav-item active"><span class="nav-pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg></span>Focus</div>
  </nav>
</div>
</body></html>
