<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Momentum — Pick habits</title><link rel="stylesheet" href="../assets/design.css"></head><body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="sb-right">5G ▮▮▮ 87%</span></div>
  <div class="screen onboarding">
    <div class="row gap3">
      <span class="back">←</span>
      <div class="step-bars"><i class="step-bar on"></i><i class="step-bar on"></i><i class="step-bar"></i><i class="step-bar"></i></div>
    </div>

    <div class="grow" style="padding-top:26px">
      <h1>What would you like<br>to build?</h1>
      <p class="mt2">Select 1 or more habits. You can change these later.</p>

      <div class="row gap2 mt6" style="flex-wrap:wrap">
        <span class="chip select active"><span class="tile sleep" style="width:26px;height:26px;font-size:13px">☾</span> Sleep 7+ hrs <span class="lime">✓</span></span>
        <span class="chip select active"><span class="tile move" style="width:26px;height:26px;font-size:13px">↗</span> Move 20 min <span class="lime">✓</span></span>
        <span class="chip select"><span class="tile lime" style="width:26px;height:26px;font-size:13px">▤</span> Read</span>
        <span class="chip select"><span class="tile phone" style="width:26px;height:26px;font-size:13px">▣</span> No phone in bed</span>
        <span class="chip select"><span class="tile water" style="width:26px;height:26px;font-size:13px">◈</span> Drink water</span>
        <span class="chip select"><span class="tile lime" style="width:26px;height:26px;font-size:13px">✎</span> Journal</span>
        <span class="chip select" style="border-style:dashed;color:var(--primary)"><span style="font-size:15px">＋</span> Custom habit</span>
      </div>

      <p class="tiny mono mt5" style="color:var(--info)">SELECTED: 2 HABITS</p>
    </div>

    <button class="btn">Continue <span style="font-size:17px;font-weight:400">→</span></button>
    <div style="height:12px"></div>
  </div>
</div>
</body></html>
