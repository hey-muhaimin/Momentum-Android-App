<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Momentum — New habit</title><link rel="stylesheet" href="../assets/design.css"></head><body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="sb-right">5G ▮▮▮ 87%</span></div>
  <div class="screen" style="opacity:.22;padding-top:20px"><h1>Habits</h1><div class="card mt5" style="height:140px"></div></div>

  <div class="sheet-wrap"><div class="sheet">
    <div class="grabber"></div>
    <div class="row between"><h2>New habit</h2><span class="txt3">✕</span></div>

    <div class="eyebrow mt5">Habit name</div>
    <div class="field filled mt2">Morning stretch</div>

    <div class="eyebrow mt5">Icon</div>
    <div class="row gap2 mt2">
      <span class="tile lime" style="outline:2px solid var(--primary)">↗</span><span class="tile">☾</span><span class="tile">◈</span><span class="tile">▤</span><span class="tile">✎</span><span class="tile">⚡</span>
    </div>

    <div class="eyebrow mt5">Color accent</div>
    <div class="row gap3 mt2">
      <span class="dot" style="width:26px;height:26px;background:var(--primary)"></span>
      <span class="dot" style="width:26px;height:26px;background:#7DD8C6"></span>
      <span class="dot" style="width:26px;height:26px;background:#FFB84D"></span>
      <span class="dot" style="width:26px;height:26px;background:#B08CFF"></span>
      <span class="dot" style="width:26px;height:26px;background:#64B5F6"></span>
    </div>

    <div class="eyebrow mt5">Tracking method</div>
    <div class="row gap2 mt2">
      <span class="chip active" style="flex:1;justify-content:center">Manual</span>
      <span class="chip" style="flex:1;justify-content:center;font-size:11px">Health · Sleep</span>
      <span class="chip" style="flex:1;justify-content:center;font-size:11px">Health · Steps</span>
    </div>

    <div class="card mt5" style="background:var(--surface)">
      <div class="row between"><div class="row gap3"><span style="color:var(--primary)">🔔</span><div><h3>Daily reminder</h3><div class="tiny txt3 mt2">7:00 AM · Every day</div></div></div><span class="switch on"></span></div>
    </div>

    <button class="btn mt6">Save habit</button>
  </div></div>
</div>
</body></html>
