<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Momentum — Focus</title><link rel="stylesheet" href="../assets/design.css"></head><body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="sb-right">5G ▮▮▮ 87%</span></div>
  <div class="screen">
    <div class="row between"><div><h1>Focus</h1><div class="eyebrow mt2">Deep work, better you</div></div><button class="icon-btn" style="background:transparent;color:var(--text-2)">⚙</button></div>

    <div class="card lg center mt6" style="text-align:center;padding:26px 20px">
      <div class="ring mx-auto" style="--pct:100%;width:220px;height:220px;background:conic-gradient(var(--primary) 0 100%,var(--outline) 100%)">
        <div><div class="mono numeral" style="font-size:42px">25:00</div><div class="eyebrow mt2">Focus time</div></div>
      </div>
      <button class="btn play-btn mx-auto mt5">▶</button>
      <div class="tiny txt3 mt3">Start when you're ready. Your session stays local.</div>
    </div>

    <div class="row gap2 mt5" style="overflow:hidden">
      <span class="chip active" style="justify-content:center;flex:1">25m Focus</span>
      <span class="chip" style="justify-content:center;flex:1">50m Deep</span>
      <span class="chip" style="justify-content:center;flex:1">15m Break</span>
    </div>

    <div class="card mt5" style="cursor:pointer">
      <div class="row between"><div class="row gap3"><span class="tile lime">✎</span><div><h3>Brain Dump</h3><div class="tiny txt3 mt2">3 parked thoughts</div></div></div><span class="lime">＋</span></div>
    </div>

    <div class="card flat mt4">
      <div class="row between"><div><div class="eyebrow">Today's focus</div><div class="mono numeral mt2" style="font-size:21px">1h 20m <span class="tiny txt3" style="font-weight:400">· 3 sessions</span></div></div><span class="badge">On track</span></div>
    </div>
  </div>
  <nav class="bottom-nav">
    <div class="nav-item"><span class="nav-pill"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>Today</div>
    <div class="nav-item"><span class="nav-pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg></span>Habits</div>
    <div class="nav-item"><span class="nav-pill"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M2 20h20"/></svg></span>Insights</div>
    <div class="nav-item active"><span class="nav-pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg></span>Focus</div>
  </nav>
</div>
</body></html>
