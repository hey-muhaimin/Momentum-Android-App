<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Momentum — Reminder</title><link rel="stylesheet" href="../assets/design.css"></head><body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="sb-right">5G ▮▮▮ 87%</span></div>
  <div class="screen onboarding">
    <div class="row gap3">
      <span class="back">←</span>
      <div class="step-bars"><i class="step-bar on"></i><i class="step-bar on"></i><i class="step-bar on"></i><i class="step-bar on"></i></div>
    </div>

    <div class="grow" style="padding-top:26px">
      <div class="eyebrow lime">Daily reminder</div>
      <h1 class="mt3">Want a nudge if you haven't logged by evening?</h1>

      <div class="card lg center mt6" style="text-align:center">
        <div class="tile lime mx-auto" style="width:58px;height:58px;border-radius:50%;font-size:26px">🔔</div>
        <h3 class="mt4">Evening Check-in</h3>
        <p class="tiny mt2" style="max-width:220px">A quick reminder before bed to log your day.</p>
        <div class="chip mt5" style="border-color:rgba(215,247,91,.5);color:var(--text);font-size:14px;padding:12px 18px">
          <span style="font-size:15px">◷</span> <span class="mono">8:00 PM</span> <span class="lime">⌄</span>
        </div>
      </div>
      <p class="tiny txt3 text-center mt4">You can change or turn this off anytime.</p>
    </div>

    <button class="btn">Remind me</button>
    <button class="btn ghost sm" style="margin-top:6px">Not now</button>
  </div>
</div>
</body></html>
