<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Momentum — Mood &amp; energy check-in</title><link rel="stylesheet" href="../assets/design.css"></head><body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="sb-right">5G ▮▮▮ 87%</span></div>
  <div class="screen" style="opacity:.25">
    <h1>Good evening,<br>Muhaimin 👋</h1>
    <div class="card lg center mt5"><div class="ring mx-auto" style="--pct:60%;width:140px;height:140px"><div><div class="numeral" style="font-size:34px">60%</div></div></div></div>
  </div>

  <div class="sheet-wrap">
    <div class="sheet">
      <div class="grabber"></div>
      <div class="row between"><h2>How are you feeling?</h2><span class="badge">Not logged yet</span></div>
      <p class="tiny mt2">A quick check-in. Both ratings stay on this device.</p>

      <div class="card mt5" style="background:var(--surface)">
        <div class="row between"><h3>Mood</h3><span class="lime mono small" style="font-weight:600">7/10 · 🙂 Good</span></div>
        <div class="track mt4"><i style="width:70%"></i></div>
        <div class="row between tiny txt3 mt2"><span>1 😔 Low</span><span>5 😐 Neutral</span><span>10 🤩 Peak</span></div>
      </div>

      <div class="card mt4" style="background:var(--surface)">
        <div class="row between"><h3>Energy</h3><span class="mono small" style="color:var(--info);font-weight:600">8/10 · 🔋 High</span></div>
        <div class="track mt4"><i style="width:80%;background:var(--info)"></i></div>
        <div class="row between tiny txt3 mt2"><span>1 🪫 Low</span><span>5 ⚡ Balanced</span><span>10 🚀 High</span></div>
      </div>

      <button class="btn mt6">Save check-in</button>
      <button class="btn ghost sm mt2">Skip for now</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active"><span class="nav-pill"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>Today</div>
    <div class="nav-item"><span class="nav-pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg></span>Habits</div>
    <div class="nav-item"><span class="nav-pill"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M2 20h20"/></svg></span>Insights</div>
    <div class="nav-item"><span class="nav-pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg></span>Focus</div>
  </nav>
</div>
</body></html>
