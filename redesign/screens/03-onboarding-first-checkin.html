<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Momentum — First check-in</title><link rel="stylesheet" href="../assets/design.css"></head><body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="sb-right">5G ▮▮▮ 87%</span></div>
  <div class="screen onboarding">
    <div class="row gap3">
      <span class="back">←</span>
      <div class="step-bars"><i class="step-bar on"></i><i class="step-bar on"></i><i class="step-bar on"></i><i class="step-bar"></i></div>
    </div>

    <div class="grow" style="padding-top:22px">
      <div class="eyebrow lime">Today, Tue Nov 24</div>
      <h1 class="mt2">Let's log today.</h1>
      <p class="mt2">Optional — rate your mood and check off anything you've already done.</p>

      <div class="card lg mt5">
        <h3>How's your mood &amp; energy today?</h3>
        <div class="mood-row mt4">
          <div class="mood-dot">😔</div><div class="mood-dot">😐</div><div class="mood-dot">🙂</div>
          <div class="mood-dot active">😊</div><div class="mood-dot">⚡</div>
        </div>
        <p class="tiny text-center mt3">Feeling good! Energy is high today.</p>
      </div>

      <div class="eyebrow mt6">Check off today's habits</div>
      <div class="col gap3 mt3">
        <div class="habit done"><span class="tile sleep">☾</span><div class="grow"><div class="name">Sleep 7+ hrs</div><div class="meta">Completed today</div></div><span class="check done">✓</span></div>
        <div class="habit"><span class="tile move">↗</span><div class="grow"><div class="name">Move 20 min</div><div class="meta">Not logged yet</div></div><span class="check">✓</span></div>
      </div>
    </div>

    <button class="btn">Save first log</button>
    <div style="height:12px"></div>
  </div>
</div>
</body></html>
